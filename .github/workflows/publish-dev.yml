# Publish the :dev image to GHCR on every merge/push to the `dev` branch.
#
# Trigger: a push to `dev` (a PR merged into it) — or a manual run. Output:
#   ghcr.io/mega-yfue/ha-eufy-sdk-bridge:dev  (a rolling tag for the development line).
#
# The bridge pulls @mega-yfue/eufy-sdk from public npm (no build context / SDK checkout). Uses the
# docker CLI in shell rather than the docker/* marketplace actions — the org's Actions policy allows
# only actions owned by mega-yfue or created by GitHub, so actions/checkout is fine but docker/* is not.
# buildx is preinstalled; arm64 emulation via a tonistiigi/binfmt image pull; push via GITHUB_TOKEN.
name: Publish :dev image to GHCR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mega-yfue/ha-eufy-sdk-bridge

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable arm64 emulation (binfmt)
        run: docker run --rm --privileged tonistiigi/binfmt --install arm64
      - name: Create a buildx builder
        run: docker buildx create --use --name eufy-ci --driver docker-container
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push :dev
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:dev" \
            --push \
            .
      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:dev\`"
            echo ""
            echo "Rolling dev tag · platforms \`linux/amd64\`, \`linux/arm64\`."
          } >> "$GITHUB_STEP_SUMMARY"
