# Publish the :dev image to GHCR on every merge/push to the `dev` branch.
#
# Trigger: a push to `dev` (i.e. a PR merged into dev) — or a manual run. Output:
#   ghcr.io/mega-yfue/ha-eufy-sdk-bridge:dev  (a rolling tag for the development line).
#
# The bridge pulls @mega-yfue/eufy-sdk from the public npm registry (no build context / no SDK
# checkout), so this just builds the Dockerfile as-is. Multi-arch amd64 + arm64 (node:24-alpine has
# no arm/v7 base). Pushing to ghcr.io/mega-yfue/* uses the built-in GITHUB_TOKEN via packages: write.
name: Publish :dev image to GHCR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mega-yfue/ha-eufy-sdk-bridge

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :dev
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:dev\`"
            echo ""
            echo "Rolling dev tag · platforms \`linux/amd64\`, \`linux/arm64\`."
            echo "Verify: \`docker buildx imagetools inspect $IMAGE:dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
