# Publish the :dev image to GHCR on every merge/push to the `dev` branch.
#
# Trigger: a push to `dev` (i.e. a PR merged into dev) — or a manual run. Output:
#   ghcr.io/mega-yfue/ha-eufy-sdk-bridge:dev  (a rolling tag for the development line).
#
# The bridge pulls @mega-yfue/eufy-sdk from the public npm registry (no build context / no SDK
# checkout). The committed package.json/lock pin the STABLE SDK (same as `main` — no beta drift in the
# repo); this build passes `SDK_DIST_TAG=beta` so the :dev image overlays the LATEST eufy-sdk beta at
# build time. Bumping the beta needs no commit here — the next merge to `dev` picks it up automatically.
# Multi-arch amd64 + arm64 (node:24-alpine has no arm/v7 base). Pushing to ghcr.io/mega-yfue/* uses the
# built-in GITHUB_TOKEN via packages: write.
name: Publish :dev image to GHCR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mega-yfue/ha-eufy-sdk-bridge

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the current eufy-sdk @beta version
        id: sdk
        # Pin the image to the EXACT beta npm currently serves, not the floating `beta` tag. Passing the
        # concrete version as the build-arg also makes the Docker layer cache key track it: a new beta
        # busts the cache and rebuilds; an unchanged beta reuses the cache. `beta` is a safe fallback.
        run: |
          VER="$(npm view @mega-yfue/eufy-sdk@beta version 2>/dev/null || true)"
          [ -n "$VER" ] || VER="beta"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          echo "Building :dev against @mega-yfue/eufy-sdk@$VER"
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :dev
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:dev
          # The dev line rides the newest eufy-sdk beta (resolved above) — the committed lockfile stays
          # on the stable pin, so this arg is the ONLY beta selector.
          build-args: |
            SDK_DIST_TAG=${{ steps.sdk.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:dev\`"
            echo ""
            echo "Rolling dev tag · platforms \`linux/amd64\`, \`linux/arm64\`."
            echo "eufy-sdk: \`${{ steps.sdk.outputs.tag }}\` (latest beta, resolved at build time)."
            echo "Verify: \`docker buildx imagetools inspect $IMAGE:dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
