# Publish the multi-arch bridge image to GitHub Container Registry on a release.
#
# Trigger: a published GitHub Release (the release tag names the version), or a manual run.
# Output:  ghcr.io/mega-yfue/ha-eufy-sdk-bridge:<version> + :latest — one manifest carrying
#          linux/amd64 + linux/arm64 (node:24-alpine has no arm/v7 base).
#
# This is the CI counterpart of scripts/publish-multiarch.sh. The bridge pulls @mega-yfue/eufy-sdk from
# the PUBLIC npm registry, so there is no SDK checkout / named build context — the built-in
# GITHUB_TOKEN (packages: write) is the only credential needed.
name: Publish image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 0.2.0). Defaults to package.json."
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mega-yfue/ha-eufy-sdk-bridge

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the bridge
        uses: actions/checkout@v4

      - name: Resolve version (release tag must match package.json)
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          VER="${VER#v}"   # tolerate a leading v (v0.2.0 → 0.2.0)
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::release/input version '$VER' does not match package.json '$PKG' — bump package.json to match before releasing"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$VER (+ :latest)"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          # Speeds up re-runs; the arm64 leg builds under emulation and is the slow part.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:${{ steps.v.outputs.version }}\`"
            echo ""
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` · also tagged \`:latest\`"
            echo ""
            echo "Verify: \`docker buildx imagetools inspect $IMAGE:${{ steps.v.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
