# One-time publisher: fires only for the prepared 0.7.2 package bump merged to main.
# Remove after the tagged release and GHCR image have been verified.
name: Publish Bridge v0.7.2

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify requested release
        id: version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" = "0.7.2" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing version $PKG from this one-time workflow"
          fi

      - name: Enable arm64 emulation
        if: steps.version.outputs.publish == 'true'
        run: docker run --rm --privileged tonistiigi/binfmt --install arm64

      - name: Configure buildx
        if: steps.version.outputs.publish == 'true'
        run: docker buildx create --use --name eufy-release --driver docker-container

      - name: Login to GHCR
        if: steps.version.outputs.publish == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish amd64 and arm64
        if: steps.version.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ha-eufy-sdk-bridge
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:0.7.2" \
            --tag "$IMAGE:latest" \
            --push .

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.2 >/dev/null 2>&1 || gh release create v0.7.2 \
            --target "$GITHUB_SHA" \
            --title "v0.7.2" \
            --notes "Stable Eufy SDK Bridge 0.7.2 fork. SDK 0.5.0, direct Annex-B to go2rtc without FFmpeg, wired-camera continuous streams, HomeBase P2P reachability, optical views and the FeromonDE realtime arming paths. Published image: ghcr.io/feromonde/ha-eufy-sdk-bridge:0.7.2 (amd64/arm64)."
